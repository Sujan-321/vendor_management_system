<header class="topbar">
  <button class="icon-btn menu-toggle" type="button" aria-label="Toggle menu">
    <i class="bi bi-list" style="font-size:20px;"></i>
  </button>

  <div class="topbar-search">
    <i class="bi bi-search"></i>
    <input type="text" placeholder="Search products, orders, SKUs…">
  </div>

  <div class="topbar-spacer"></div>

  <div class="topbar-actions">
    <a href="#" class="icon-btn" title="Orders">
      <i class="bi bi-receipt"></i>
    </a>
    <button class="icon-btn" type="button" title="Notifications">
      <i class="bi bi-bell"></i>
      <span class="dot"></span>
    </button>

    <div class="topbar-user">
      <div class="avatar">
        
      </div>
      <div class="who">
        <div class="n"></div>
        <div class="r">Vendor</div>
      </div>
      <i class="bi bi-chevron-down" style="font-size:11px;color:var(--ink-faint);"></i>
    </div>
  </div>
</header>
